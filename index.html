<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR HUB - Gestion des Horaires et RH</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome pour icônes épurées -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rhDark: '#2f3640',
                        rhLight: '#f5f6fa',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="modulepreload" href="/src/js/app.js">
</head>
<body class="bg-[#f5f6fa] text-[#2f3640] min-h-screen flex flex-col md:flex-row antialiased">

    <!-- Modal de Notification personnalisé (Pas d'alert() natif) -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2"></div>

    <!-- Modal dynamique (Ajout / Modification / Créneau) -->
    <div id="app-modal" class="fixed inset-0 bg-black bg-opacity-40 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white border-2 border-[#2f3640] rounded-3xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-xl font-bold text-[#2f3640]">Titre Modal</h3>
                <button data-close-modal class="w-8 h-8 rounded-full border-2 border-[#2f3640] flex items-center justify-center text-[#2f3640] hover:bg-[#2f3640] hover:text-[#f5f6fa]">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body">
                <!-- Contenu injecté dynamiquement par les modules -->
            </div>
        </div>
    </div>

    <!-- SIDEBAR (Navigation) -->
    <aside class="w-full md:w-64 bg-[#2f3640] text-[#f5f6fa] flex flex-col justify-between p-6 shrink-0">
        <div>
            <!-- Logo / Brand -->
            <div class="flex items-center space-x-3 mb-10">
                <div class="w-10 h-10 rounded-full border-2 border-[#f5f6fa] flex items-center justify-center text-lg font-bold">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <span class="text-xl font-bold tracking-wider">HR HUB</span>
            </div>

            <!-- Liens de navigation (générés par le module sidebar) -->
            <nav id="main-nav" class="space-y-2"></nav>
        </div>

        <!-- Profil Utilisateur Bas de Page -->
        <div class="pt-6 border-t border-white border-opacity-20 flex items-center space-x-3 mt-6 md:mt-0">
            <div class="w-9 h-9 rounded-full border-2 border-[#f5f6fa] flex items-center justify-center font-bold text-sm">
                AD
            </div>
            <div class="overflow-hidden">
                <p class="text-sm font-semibold truncate">A. Dubois</p>
                <p class="text-xs text-gray-400 truncate">RH Manager</p>
            </div>
        </div>
    </aside>

    <!-- ZONE DE CONTENU PRINCIPAL : chaque page est un module JS qui injecte son HTML -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <div id="page-container"></div>
    </main>

    <!-- Point d'entrée modularisé (ES modules) -->
    <script type="module" src="/src/js/app.js"></script>
</body>
</html>
