<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR HUB - Gestion des Horaires et RH</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <!-- ZÉRO CDN : Tailwind, Inter et FontAwesome sont vendorisés via npm
         et compilés localement par Vite (@tailwindcss/vite). -->
    <link rel="stylesheet" href="/src/css/app.css">
    <link rel="modulepreload" href="/src/js/app.js">
</head>
<body class="bg-[#f5f6fa] text-[#2f3640] h-screen flex flex-col md:flex-row antialiased overflow-hidden">

    <!-- Modal de Notification personnalisé (Pas d'alert() natif) -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2"></div>

    <!-- Modal dynamique (Ajout / Modification / Créneau) -->
    <div id="app-modal" class="fixed inset-0 bg-black/40 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white border-2 border-[#2f3640] rounded-3xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-xl font-bold text-[#2f3640]">Titre Modal</h3>
                <button data-close-modal class="w-8 h-8 rounded-full border-2 border-[#2f3640] flex items-center justify-center text-[#2f3640] hover:bg-[#2f3640] hover:text-[#f5f6fa]">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body">
                <!-- Contenu injecté dynamiquement par les modules -->
            </div>
        </div>
    </div>

    <!-- SIDEBAR (Navigation) : fixe, ne défile jamais — seul le contenu défile -->
    <aside class="w-full md:w-64 h-auto md:h-screen bg-[#2f3640] text-[#f5f6fa] flex flex-col justify-between p-6 shrink-0 md:overflow-y-auto">
        <div>
            <!-- Logo / Brand -->
            <div class="flex items-center space-x-3 mb-10">
                <img src="/icon.png" alt="HR HUB" class="w-10 h-10 rounded-xl shadow-sm" />
                <span class="text-xl font-bold tracking-wider">HR HUB</span>
            </div>

            <!-- Liens de navigation (générés par le module sidebar) -->
            <nav id="main-nav" class="space-y-2"></nav>
        </div>
    </aside>

    <!-- ZONE DE CONTENU PRINCIPAL : seule cette zone défile (la sidebar reste immobile) -->
    <main class="flex-1 md:h-screen p-6 md:p-10 overflow-y-auto">
        <div id="page-container"></div>
    </main>

    <!-- Point d'entrée modularisé (ES modules) -->
    <script type="module" src="/src/js/app.js"></script>
</body>
</html>
